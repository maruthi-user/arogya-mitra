<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${heading}">Notification</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f6f8;font-family:Arial,Helvetica,sans-serif;">
<!--/*
  Generic message: heading, paragraphs, optional button.
  Variables: heading, paragraphs (list), actionUrl + actionLabel (optional). Branding variables are added for you.
  Copy this file to templates/email/notification.html in your application to restyle every notification.
*/-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f6f8;padding:40px 15px;">
    <tr>
        <td align="center">
            <table role="presentation" width="600" cellpadding="0" cellspacing="0"
                   style="width:100%;max-width:600px;background-color:#ffffff;border-radius:10px;overflow:hidden;">
                <tr>
                    <td style="padding:30px 40px 20px;border-bottom:1px solid #edf0f2;">
                        <img th:if="${logoUrl != null and !logoUrl.isEmpty()}" th:src="${logoUrl}"
                             th:alt="${companyName}" height="36" style="display:block;margin-bottom:10px;">
                        <span style="font-size:22px;font-weight:700;color:#111827;" th:text="${productName}">Product</span>
                    </td>
                </tr>
                <tr>
                    <td style="padding:35px 40px;">
                        <h1 style="margin:0 0 20px;font-size:24px;line-height:32px;color:#111827;" th:text="${heading}">Heading</h1>
                        <p th:each="line : ${paragraphs}" th:text="${line}"
                           style="margin:0 0 16px;font-size:15px;line-height:24px;color:#4b5563;">Text</p>
                        <p th:if="${actionUrl != null and !actionUrl.isEmpty()}"
                           style="text-align:center;padding:15px 0 10px;margin:0;">
                            <a th:href="${actionUrl}" th:text="${actionLabel != null ? actionLabel : 'Open'}"
                               style="display:inline-block;background-color:#2563eb;color:#ffffff;text-decoration:none;font-size:15px;font-weight:700;padding:13px 28px;border-radius:6px;">Open</a>
                        </p>
                    </td>
                </tr>
                <tr>
                    <td style="padding:20px 40px;background-color:#f9fafb;font-size:12px;color:#9ca3af;text-align:center;">
                        &copy; <span th:text="${currentYear}">2026</span>
                        <span th:text="${productName}">Product</span>
                        <span th:if="${companyName != null and !companyName.isEmpty()}"> &mdash; <span th:text="${companyName}">Company</span></span>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
